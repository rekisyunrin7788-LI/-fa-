<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的专属日语私教</title>
    <style>
        body { font-family: 'Nunito', 'Microsoft YaHei', sans-serif; background-color: #f7f9f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .app-container { background: white; width: 100%; max-width: 420px; height: 90vh; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 24px; display: flex; flex-direction: column; position: relative; overflow: hidden; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #afafaf; font-weight: bold; }
        .progress-bar { flex-grow: 1; height: 16px; background: #e5e5e5; border-radius: 10px; overflow: hidden; margin: 0 15px; }
        .progress-fill { height: 100%; background: #58cc02; width: 0%; transition: width 0.3s ease; border-radius: 10px; }
        
        .question-title { font-size: 20px; font-weight: bold; color: #3c3c3c; margin-bottom: 20px; line-height: 1.4; }
        .audio-btn { background: #1cb0f6; color: white; border: none; border-radius: 50%; width: 70px; height: 70px; font-size: 30px; cursor: pointer; box-shadow: 0 5px 0 #1899d6; margin: 0 auto 20px; display: block; transition: all 0.1s; }
        .audio-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #1899d6; }
        .sentence-display { font-size: 22px; text-align: center; color: #4b4b4b; margin-bottom: 25px; min-height: 40px; font-weight: bold; line-height: 1.5; }
        
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: white; border: 2px solid #e5e5e5; border-radius: 16px; padding: 16px; font-size: 16px; color: #4b4b4b; cursor: pointer; text-align: left; transition: all 0.2s; box-shadow: 0 3px 0 #e5e5e5; font-weight: bold; }
        .option-btn:hover { background: #f1f7fe; border-color: #84d8ff; }
        .option-btn.selected { background: #ddf4ff; border-color: #1cb0f6; color: #1cb0f6; box-shadow: 0 3px 0 #1cb0f6; }
        .option-btn.correct { background: #d7ffb8 !important; border-color: #58cc02 !important; color: #58cc02 !important; box-shadow: 0 3px 0 #58cc02 !important; }
        .option-btn.wrong { background: #ffdfe0 !important; border-color: #ea2b2b !important; color: #ea2b2b !important; box-shadow: 0 3px 0 #ea2b2b !important; }

        .builder-area { display: flex; flex-wrap: wrap; gap: 10px; min-height: 60px; border-bottom: 2px solid #e5e5e5; padding-bottom: 10px; margin-bottom: 20px; }
        .word-pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .chunk-btn { background: white; border: 2px solid #e5e5e5; border-radius: 12px; padding: 10px 15px; font-size: 18px; color: #4b4b4b; cursor: pointer; box-shadow: 0 3px 0 #e5e5e5; font-weight: bold; }
        .chunk-btn.hidden { visibility: hidden; }

        .bottom-area { margin-top: auto; padding-top: 15px; }
        .check-btn { width: 100%; background: #58cc02; color: white; border: none; border-radius: 16px; padding: 16px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #58a700; transition: all 0.2s; }
        .check-btn:disabled { background: #e5e5e5; color: #afafaf; box-shadow: 0 4px 0 #cecece; cursor: not-allowed; }
        
        .feedback-sheet { position: absolute; bottom: -100%; left: 0; right: 0; background: white; padding: 24px; border-top-left-radius: 24px; border-top-right-radius: 24px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); transition: bottom 0.3s ease; box-sizing: border-box; z-index: 10;}
        .feedback-sheet.show { bottom: 0; }
        .context-text { font-size: 14px; color: #555; margin-top: 15px; background: #f0f0f0; padding: 12px; border-radius: 12px; line-height: 1.5; }
        
        #loading { text-align: center; color: #1cb0f6; font-size: 18px; font-weight: bold; margin-top: 50%; }
        
        /* 👇 新增：让题目区域自适应高度并可以上下滑动 👇 */
        #quiz-container { 
            flex-grow: 1; 
            overflow-y: auto; 
            overflow-x: hidden; 
            margin-bottom: 10px; 
            padding-right: 5px; 
        }
        #quiz-container::-webkit-scrollbar { width: 4px; }
        #quiz-container::-webkit-scrollbar-thumb { background-color: #e5e5e5; border-radius: 4px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span id="streak">🔥 0</span>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <span>❤️ 5</span>
    </div>
    
    <div id="quiz-container">
        <div id="loading">☁️ 正在从题库同步你的专属笔记...<br><span style="font-size: 12px; color: #afafaf; margin-top: 10px; display: block;">首次加载可能需要几秒钟</span></div>
    </div>
    
    <div class="bottom-area">
        <button id="main-btn" class="check-btn" disabled onclick="handleMainAction()">检查</button>
    </div>

    <div class="feedback-sheet" id="feedback">
        <h2 id="feedback-title" style="margin-top:0;"></h2>
        <div class="sentence-display" id="sentence-full" style="font-size: 18px; text-align: left; margin-bottom: 10px;"></div>
        <div class="context-text" id="context"></div>
        <button class="check-btn" onclick="nextQuestion()" style="margin-top: 20px;">继续下题</button>
    </div>
</div>

<script>
    // 你的全新专属 API 链接
    const API_URL = "https://script.google.com/macros/s/AKfycbyknolqX-7ZhfTAlRj2T3hjMHjW7hYnlYSqhDfdO6RyovWSTw9gfNscTnqZN7mpFsEmRw/exec";
    
    let quizData = [];
    let currentQ = 0;
    let currentType = 1; 
    let selectedAnswer = null;
    let builtSentenceChunks = [];

    // 辅助函数：把选项打乱，并记住哪个是正确的
    function shuffleOptions(options, correctIndex) {
        let mapped = options.map((opt, i) => ({ text: opt, isCorrect: i === correctIndex }));
        return mapped.sort(() => Math.random() - 0.5); // 随机打乱
    }

    async function fetchQuizData() {
        try {
            // 彻底打破缓存机制：每次请求加上时间戳
            const response = await fetch(API_URL + "?t=" + new Date().getTime());
            const data = await response.json();
            
            if (data && data.length > 0) {
                // 保存完整的题库
                window.fullData = data;
                
                // 随机抽出 10 题作为一次练习
                quizData = data.sort(() => Math.random() - 0.5).slice(0, 10); 
                loadQuestion();
            } else {
                document.getElementById("loading").innerHTML = "⚠️ 题库是空的！请先在 Apps Script 运行一次脚本。";
            }
        } catch (error) {
            document.getElementById("loading").innerHTML = "❌ 同步失败！<br>请检查网络或重新部署API。";
            console.error("请求错误:", error);
        }
    }
    
    function loadQuestion() {
        document.getElementById("feedback").classList.remove("show");
        document.getElementById("progress").style.width = ((currentQ) / quizData.length * 100) + "%"; 
        
        currentType = Math.floor(Math.random() * 4) + 1;
        const data = quizData[currentQ];
        const container = document.getElementById("quiz-container");
        const mainBtn = document.getElementById("main-btn");
        
        selectedAnswer = null;
        builtSentenceChunks = [];
        mainBtn.innerText = "检查";
        mainBtn.disabled = true;

        let html = "";
        
        if (currentType === 1) {
            // 听力题：从其他题目里抓取真实的干扰项翻译
            let wrongs = window.fullData.filter(d => d.translation !== data.translation).sort(() => Math.random() - 0.5).slice(0, 2);
            let opts = [
                { text: data.translation, isCorrect: true },
                { text: wrongs[0] ? wrongs[0].translation : "请确认这个项目的最终期限。", isCorrect: false },
                { text: wrongs[1] ? wrongs[1].translation : "关于刚才会议上的决定，我有疑问。", isCorrect: false }
            ].sort(() => Math.random() - 0.5); 

            html = `<div class="question-title">🎧 听录音，选出对应的中文意思</div>
                    <button class="audio-btn" onclick="playAudio('${data.japanese.replace(/'/g, "\\'")}')">🔊</button>
                    <div class="options-grid">
                        ${opts.map((opt, i) => `<button class="option-btn" onclick="selectOption(${i}, ${opt.isCorrect})">${opt.text}</button>`).join('')}
                    </div>`;
            setTimeout(() => playAudio(data.japanese), 500);

        } else if (currentType === 2) {
            // 完形填空：选项顺序完全打乱
            let shuffledOpts = shuffleOptions(data.clozeOptions, data.clozeAnswer);
            html = `<div class="question-title">🧩 补全句子</div>
                    <button class="audio-btn" onclick="playAudio('${data.japanese.replace(/'/g, "\\'")}')" style="width:50px;height:50px;font-size:20px;margin-bottom:10px;">🔊</button>
                    <div class="sentence-display">${data.clozeMask.replace('_____', '<span style="color:#1cb0f6; border-bottom: 2px dashed #1cb0f6;">_____</span>')}</div>
                    <div class="options-grid">
                        ${shuffledOpts.map((opt, i) => `<button class="option-btn" onclick="selectOption(${i}, ${opt.isCorrect})">${opt.text}</button>`).join('')}
                    </div>`;

        } else if (currentType === 3) {
            // 情景题：选项顺序完全打乱
            let shuffledOpts = shuffleOptions(data.scenarioOptions, data.scenarioAnswer);
            html = `<div class="question-title">💡 ${data.scenario}</div>
                    <div class="options-grid">
                        ${shuffledOpts.map((opt, i) => `<button class="option-btn" onclick="selectOption(${i}, ${opt.isCorrect})">${opt.text}</button>`).join('')}
                    </div>`;

        } else if (currentType === 4) {
            // 拼写题：词块打乱
            let shuffled = [...data.chunks].sort(() => Math.random() - 0.5);
            html = `<div class="question-title">🧱 拼出正确的日语</div>
                    <div class="sentence-display" style="font-size: 16px;">${data.translation}</div>
                    <div class="builder-area" id="builder-area"></div>
                    <div class="word-pool" id="word-pool">
                        ${shuffled.map((chunk, i) => `<button class="chunk-btn" id="chunk-${i}" onclick="toggleChunk('${chunk}', ${i})">${chunk}</button>`).join('')}
                    </div>`;
        }
        container.innerHTML = html;
    }

    function playAudio(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        window.speechSynthesis.speak(utterance);
    }

    window.selectOption = function(index, isCorrect) {
        const options = document.querySelectorAll('.option-btn');
        options.forEach(opt => opt.classList.remove('selected'));
        options[index].classList.add('selected');
        selectedAnswer = isCorrect;
        document.getElementById("main-btn").disabled = false;
    };

    window.toggleChunk = function(text, id) {
        const btn = document.getElementById(`chunk-${id}`);
        const builderArea = document.getElementById("builder-area");
        
        if (btn.classList.contains('hidden')) {
            btn.classList.remove('hidden');
            document.getElementById(`built-${id}`).remove();
            builtSentenceChunks = builtSentenceChunks.filter(c => c.id !== id);
        } else {
            btn.classList.add('hidden');
            const builtBtn = document.createElement("button");
            builtBtn.className = "chunk-btn";
            builtBtn.id = `built-${id}`;
            builtBtn.innerText = text;
            builtBtn.onclick = () => toggleChunk(text, id);
            builderArea.appendChild(builtBtn);
            builtSentenceChunks.push({id: id, text: text});
        }
        const data = quizData[currentQ];
        document.getElementById("main-btn").disabled = builtSentenceChunks.length !== data.chunks.length;
    };

    window.handleMainAction = function() {
        const data = quizData[currentQ];
        let isCorrect = false;

        if (currentType === 4) {
            const builtText = builtSentenceChunks.map(c => c.text).join('');
            const correctText = data.chunks.join('');
            isCorrect = builtText === correctText;
        } else {
            isCorrect = selectedAnswer;
        }
        showFeedback(isCorrect, data);
    };

    function showFeedback(isCorrect, data) {
        if (isCorrect) {
            document.getElementById("feedback-title").innerText = "🎉 完美！太地道了！";
            document.getElementById("feedback-title").style.color = "#58cc02";
            document.getElementById("feedback").style.background = "#d7ffb8";
        } else {
            document.getElementById("feedback-title").innerText = "❌ 正确答案是：";
            document.getElementById("feedback-title").style.color = "#ea2b2b";
            document.getElementById("feedback").style.background = "#ffdfe0";
        }

        document.getElementById("sentence-full").innerHTML = `${data.japanese} <button style="border:none;background:none;cursor:pointer;font-size:20px;" onclick="playAudio('${data.japanese.replace(/'/g, "\\'")}')">🔊</button>`;
        document.getElementById("context").innerHTML = data.context;
        document.getElementById("feedback").classList.add("show");
        document.getElementById("main-btn").disabled = true;
    }

    window.nextQuestion = function() {
        currentQ++;
        if (currentQ < quizData.length) {
            loadQuestion();
        } else {
            alert("👏 恭喜！今天的10道题全部刷完啦！重新抽取新题目...");
            currentQ = 0;
            quizData = window.fullData.sort(() => Math.random() - 0.5).slice(0, 10); 
            loadQuestion();
        }
    };

    // 启动拉取数据
    fetchQuizData();
</script>
</body>
</html>
